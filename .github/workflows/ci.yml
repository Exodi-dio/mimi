name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'NOTICE'
      - 'README.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mimi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Branding gate
        run: |
          if grep -rniE '\b(tune|bitchord|melox|convx|airmedy|misa198)\b' \
              --exclude-dir=.git --exclude-dir=.github --exclude-dir=build \
              --exclude-dir=.gradle --exclude=NOTICE --exclude=README.md . ; then
            echo "STALE BRANDING FOUND"; exit 1
          fi
