name: gen-beta-keystore

# One-time helper. Generates MIMI's long-lived beta signing key on a runner
# (never on a local machine) and uploads it as an artifact. Download it, commit
# it to tools/keystore/, and this workflow is never needed again.
#
# The key is deliberately public and not a secret: it exists so that every MIMI
# build is signed by the SAME certificate, which is what lets a new APK install
# straight over an older one instead of forcing an uninstall.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate beta keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/mimi-beta.keystore \
            -alias mimi-beta \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass mimibeta \
            -keypass mimibeta \
            -dname "CN=MIMI Beta, OU=Beta Signing, O=Exodi-dio, L=Cloud, C=US" \
            -noprompt
          keytool -list -v -keystore out/mimi-beta.keystore -storepass mimibeta | grep -E "Alias|Valid|SHA256|Signature algorithm" || true

      - uses: actions/upload-artifact@v4
        with:
          name: mimi-beta-keystore
          path: out/mimi-beta.keystore
